  <body>
    <main id="demo">
      <noscript>
        <h1>Filings</h1>
        <p>
          Iron filings on a sheet of acetate over your clip, magnets under the sheet, and the
          music tapping it: an FFGL effect for Resolume Arena and Avenue. Friction pins every
          filing to the sheet until a kick in the music taps it; each tap turns the filings
          part way into the magnets' field, slides them towards the poles and chains them end
          to end, so the field lines come up over a few kicks. Move a magnet and nothing
          happens until the next kick, and a quiet passage freezes everything mid-turn.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your browser, so
          it needs JavaScript and WebGL2. The plugin itself, its source and its downloads are
          on <a href="https://github.com/stoatworks-labs/filings">its repository</a>.
        </p>
